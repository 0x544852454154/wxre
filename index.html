  isl.addEventListener('click', function (e) { var b = e.target.closest('.ni'); if (b) go(b.dataset.p); });
  function render(id) {

  /* ── profile modal ── */
  var md = document.getElementById('md'), mb = document.getElementById('mb');
  var SL = { online: 'online', idle: 'idle', dnd: 'do not disturb', offline: 'offline' };

  function aurl(a, k) {

  }
  function clock(ms) { ms = Math.max(0, Math.floor(ms / 1000)); var h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60, p = function (n) { return n < 10 ? '0' + n : n; }; return (h ? h + ':' + p(m) : m) + ':' + p(s); }
  function timeTxt(t) {
    if (!t || !t.start) return '';
    var now = Date.now();
    if (t.end) return clock(now - t.start) + ' / ' + clock(t.end - t.start);
    return clock(now - t.start) + ' elapsed';
  }
  function fill(id) {
    var p = S[id], u = p && p.discord_user, st = p ? (p.discord_status || 'offline') : 'offline';
    var name = u ? (u.display_name || u.global_name || u.username) : id;

    var dc = u && u.avatar_decoration_data, ds = dc && dc.asset ? CDN + 'avatar-decoration-presets/' + dc.asset + '.png?size=128&passthrough=true' : '';
    var pg = u && u.primary_guild, tag = pg && pg.tag && pg.identity_enabled !== false ? pg : null;

    var h = '<div class="mh"><div class="u ' + st + '"><img class="a" src="' + esc(av) + '" alt="">' + (ds ? '<img class="d" src="' + esc(ds) + '" alt="">' : '') + '<span class="s"></span></div>'

    h += '<div class="sec"><div class="lb">status</div><div class="st ' + st + '"><i></i>' + SL[st] + '</div>';
    if (cs && (cs.state || cs.emoji)) {
      var em = cs.emoji ? (cs.emoji.id ? '<img src="' + CDN + 'emojis/' + esc(cs.emoji.id) + '.' + (cs.emoji.animated ? 'gif' : 'png') + '?size=32" alt="">' : esc(cs.emoji.name || '') + ' ') : '';

    if (!p) h += '<div class="pf">no presence data</div>';
    h += '</div>';
    h += '<div class="sec"><div class="lb">rpc</div>';
    if (rpc.length) rpc.forEach(function (a) {
      var l = aurl(a, 'large'), m = aurl(a, 'small'), t = timeTxt(a.timestamps);
      h += '<div class="act"><div class="ai">' + (l ? '<img class="l" src="' + esc(l) + '" alt="">' : '<div class="l"></div>') + (m ? '<img class="m" src="' + esc(m) + '" alt="">' : '') + '</div>'
        + '<div class="ab"><div class="ty">' + (TY[a.type] || 'playing') + '</div><b>' + esc(a.name || '') + '</b>'
        + (a.details ? '<span>' + esc(a.details) + '</span>' : '') + (a.state ? '<span>' + esc(a.state) + '</span>' : '')
        + (t ? '<span class="tm" data-s="' + (a.timestamps.start || 0) + '" data-e="' + (a.timestamps.end || 0) + '">' + t + '</span>' : '') + '</div></div>';
    }); else h += '<div class="none">nothing right now</div>';
    h += '</div>';
    var kv = p && p.kv ? Object.keys(p.kv) : [];

    if (kv.length) kv.forEach(function (k) { h += '<div class="nt"><b>' + esc(k) + '</b><span>' + esc(p.kv[k]) + '</span></div>'; }); else h += '<div class="none">no notes</div>';

  function openM(id) { openId = id; fill(id); md.classList.add('on'); }

  /* ── discord server island (about page) ── */

  fetch('https://discord.com/api/v10/invites/' + INVC + '?with_counts=true').then(function (r) { return r.json(); }).then(function (j) {

    var m = j.approximate_member_count, o = j.approximate_presence_count, h = '';

    document.getElementById('dS').innerHTML = h;
  }).catch(function () {});
  function ws() {

      else if (j.op === 0 && j.t === 'INIT_STATE') { for (var k in j.d) if (j.d[k] && j.d[k].discord_user) { S[k] = j.d[k]; render(k); } }
      else if (j.op === 0 && j.t === 'PRESENCE_UPDATE' && j.d && j.d.discord_user) { S[j.d.discord_user.id] = j.d; render(j.d.discord_user.id); }
    };

  }
  Promise.all(ALL.map(function (id) {
    return fetch('https://api.lanyard.rest/v1/users/' + id).then(function (r) { return r.json(); }).then(function (j) { if (j.success) { S[id] = j.data; render(id); } }).catch(function () {});
  })).then(ws);
  function playSong() { var p = song.play(); if (p && p.catch) p.catch(function () {}); }
